name: PSP

on:
  push:
    branches:
      - psp
    paths-ignore:
      - '*.md'
  pull_request:
    types: [opened, synchronize]
    paths-ignore:
      - '*.md'
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  psp:
    runs-on: ubuntu-latest
    # Official PSP SDK image: ships psp-cmake and SDL2 with CMake config files.
    # Once the build works, consider pinning a specific tag instead of :latest.
    container: pspdev/pspdev:latest
    steps:
    # The image is Alpine-based. git must be installed BEFORE checkout,
    # otherwise actions/checkout falls back to a tarball download with no
    # .git folder, and `git describe` (used for the version) fails.
    # bash/tar/zstd are needed by the shell steps and actions/cache.
    - name: Install host tools
      run: apk add --no-cache git bash cmake tar zstd

    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # Container runs as a different user than the workspace owner,
    # which makes git refuse to operate ("dubious ownership").
    - name: Mark workspace as safe for git
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

    - name: Cache CMake build folder
      uses: actions/cache@v4
      with:
        path: build
        # Bumped from v5 so stale artifacts from the old toolchain aren't restored
        key: psp-cmake-v6-${{ github.sha }}
        restore-keys: psp-cmake-v6-

    - name: Configure CMake
      shell: bash
      run: psp-cmake -S. -Bbuild -DCMAKE_BUILD_TYPE=RelWithDebInfo -DBUILD_PRX=1 -DENC_PRX=1

    - name: Build
      shell: bash
      run: cmake --build build -j $(nproc)

    - name: Upload-Package
      if: ${{ !env.ACT }}
      uses: actions/upload-artifact@v4
      with:
        name: EBOOT.PBP
        path: ${{ github.workspace }}/build/EBOOT.PBP
        if-no-files-found: error

